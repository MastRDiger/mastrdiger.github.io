<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>visitme</title>
  <meta name="description" content="A live page: see how many people have visited and watch everyone's cursors move in real time.">
  <meta name="theme-color" content="#0b0b12">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <header class="top">
      <div class="brand">visitme</div>
      <div class="status" id="status" data-state="connecting">
        <span class="status-dot"></span><span id="status-text">Connecting…</span>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">Live right now</p>
      <p class="lede">Every cursor you see is a real person on this page. Click anywhere to wave.</p>
    </section>

    <section class="stats">
      <div class="stat stat-live">
        <div class="stat-value" id="online-count">1</div>
        <div class="stat-label"><span class="live-dot"></span>Online now</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="visitor-count">–</div>
        <div class="stat-label">Unique visitors</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="visit-count">–</div>
        <div class="stat-label">Total visits</div>
      </div>
    </section>

    <section class="people">
      <h2>Who's here</h2>
      <ul id="people-list"></ul>
    </section>

    <button id="invite" class="invite" type="button">Copy link to invite someone</button>
  </main>

  <div id="cursor-layer" aria-hidden="true"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js"
          integrity="sha384-9WWboT9UtuPFRlOLq4FygQkcJxzYcpz8SXGkNyCEXM+44n14xzjNlrRKYZwuF/A6"
          crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
